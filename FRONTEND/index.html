<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- seo:start (el build lo reemplaza en cada página: scripts/prerender.mjs) -->
    <title>Orión Lex | Servicios Jurídicos en Colombia</title>
    <meta
      name="description"
      content="Orión Lex Servicios Jurídicos: asesoría y gestión jurídica de forma virtual en toda Colombia y para personas en el exterior con asuntos legales en el país."
    />
    <link rel="canonical" href="https://orionlex.co" />
    <meta property="og:title" content="Orión Lex | Servicios Jurídicos en Colombia" />
    <meta
      property="og:description"
      content="Orión Lex Servicios Jurídicos: asesoría y gestión jurídica de forma virtual en toda Colombia y para personas en el exterior con asuntos legales en el país."
    />
    <meta property="og:url" content="https://orionlex.co" />
    <meta property="og:image" content="https://orionlex.co/images/og-orion-lex.jpg" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- seo:end -->
    <meta property="og:site_name" content="Orión Lex Servicios Jurídicos" />
    <meta property="og:locale" content="es_CO" />
    <meta name="theme-color" content="#ffffff" />
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <script>
      // Aplica el tema antes de pintar (evita un parpadeo del tema equivocado): claro por
      // defecto, oscuro solo si el visitante lo eligió antes.
      (function () {
        var dark = false;
        try {
          dark = localStorage.getItem('orion-lex-theme') === 'dark';
        } catch (e) {}
        document.documentElement.dataset.theme = dark ? 'dark' : 'light';
        if (dark) {
          document.querySelector('meta[name="theme-color"]').content = '#0a0a0a';
        }

        var home = location.pathname === '/';
        if (home) {
          // Foto de la portada: se precarga para que aparezca cuanto antes.
          [
            ['/images/hero/portada-1672.webp', '(min-width: 768px)'],
            ['/images/hero/portada-960.webp', '(max-width: 767px)'],
          ].forEach(function (item) {
            var link = document.createElement('link');
            link.rel = 'preload';
            link.as = 'image';
            link.href = item[0];
            link.media = item[1];
            document.head.appendChild(link);
          });
        }

        // Video de intro: solo en la portada, solo la primera vez que se visita el sitio desde
        // este navegador y nunca si se pidió reducir el movimiento. Mientras carga React, una
        // cortina blanca (del color del video) tapa la página.
        var intro = false;
        try {
          intro =
            home &&
            !localStorage.getItem('orion-lex-intro') &&
            !matchMedia('(prefers-reduced-motion: reduce)').matches;
        } catch (e) {}
        if (intro) {
          document.documentElement.classList.add('intro-pending');
          // Seguro: si la app no llegara a arrancar, la cortina no se queda puesta.
          setTimeout(function () {
            document.documentElement.classList.remove('intro-pending');
          }, 8000);
          var video = document.createElement('link');
          video.rel = 'preload';
          video.as = 'fetch';
          video.href = '/video/intro-orion-lex.mp4';
          video.crossOrigin = 'anonymous';
          document.head.appendChild(video);
        }
      })();
    </script>
    <style>
      html.intro-pending {
        overflow: hidden;
      }
      html.intro-pending body::after {
        content: '';
        position: fixed;
        inset: 0;
        z-index: 2147483647;
        background: #fefefe;
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
